name: Deploy API

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "ops/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin \
              "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

      - name: Build & push image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}"
          SHA="${GITHUB_SHA}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          docker build \
            --build-arg VERSION="1.0.0" \
            --build-arg COMMIT_SHA="${SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            -t "${IMAGE_URI}:${SHA}" -t "${IMAGE_URI}:latest" app

          docker push "${IMAGE_URI}:${SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Restart service via SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          # You’ll paste your instance-id into infra output, or store it as a secret later.
          # Quick method: after terraform apply, set INSTANCE_ID in repo secrets.
          INSTANCE_ID="${{ secrets.INSTANCE_ID }}"

          aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /opt/devops-lab/ops",
              "docker compose pull",
              "docker compose up -d",
              "curl -fsS http://localhost/health"
            ]'

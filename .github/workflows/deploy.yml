name: Build and Deploy API

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: devops-lab
  INSTANCE_NAME_TAG: devops-lab-ec2
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::816069160668:role/GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPO="${PROJECT_NAME}-api"
          TAG="${GITHUB_SHA::7}"
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO}:${TAG}"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build -t "$IMAGE_URI" ./app
          docker push "$IMAGE_URI"

      - name: Deploy to K3s via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          REGISTRY="${IMAGE_URI%%/*}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devops-lab API to K3s" \
            --parameters commands="[
              \"set -e\",
              \"export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\",
              \"/usr/local/bin/kubectl -n devops-lab create secret docker-registry ecr-creds --docker-server=${REGISTRY} --docker-username=AWS --docker-password=\$(aws ecr get-login-password --region ${AWS_REGION}) --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -\",
              \"/usr/local/bin/kubectl -n devops-lab set image deployment/api api=${IMAGE_URI}\",
              \"/usr/local/bin/kubectl -n devops-lab rollout status deployment/api --timeout=120s\"
            ]" \
            --query "Command.CommandId" --output text)

          # Wait for the deploy to finish and fail the pipeline if it failed
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [ "$STATUS" = "Success" ] || { echo "Deploy failed: $STATUS"; exit 1; }

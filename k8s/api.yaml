# DevOps Lab API on K3s
# The image is set at deploy time by GitHub Actions (kubectl set image).
# For the first manual apply, setup.sh swaps IMAGE_PLACEHOLDER for a real ECR image.
apiVersion: v1
kind: Namespace
metadata:
  name: devops-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops-lab
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep serving during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-creds   # refreshed on every deploy (ECR tokens last 12 hours)
      automountServiceAccountToken: false   # the API never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops-lab
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
# Traefik ships with K3s and listens on ports 80/443 of the instance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: devops-lab
spec:
  rules:
    - host: api.ronaldoauguste.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80

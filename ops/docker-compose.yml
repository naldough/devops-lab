services:
  api:
    image: ${ECR_IMAGE_URI}
    restart: unless-stopped
    environment:
      - PORT=8080
    networks: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
